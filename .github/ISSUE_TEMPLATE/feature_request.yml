name: ✨ Feature request
description: Suggest an idea or improvement for Nib
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Nib! Please search [existing issues](https://github.com/colinder/Nib/issues) first — if your idea is already there, add a 👍 reaction instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where Nib falls short today.
      placeholder: When I write long documents, I can't quickly jump between sections…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like Nib to behave?
      description: Describe the feature, shortcut or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references
      description: Workarounds you use today, or how other apps handle this (screenshots welcome).
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - macOS
        - Windows
